<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Reserva de Transporte - Pasajero</title>
    <!-- Tailwind CSS por CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Nuestra hoja de estilos centralizada -->
    <link rel="stylesheet" href="src/styles.css">
</head>

<body class="flex flex-col min-h-screen" onload="cargarRutasPasajero()">

    <!-- BARRA SUPERIOR (Limpia, sin sesión) -->
    <header class="bg-white border-b border-slate-200 py-4 px-8 flex justify-between items-center shadow-sm">
        <h1 class="text-blue-600 font-bold text-base tracking-tight">Sistema de Reserva de Transporte</h1>
        <button onclick="window.location.href='index.html'"
            class="bg-red-600 hover:bg-red-700 text-white text-sm font-semibold px-4 py-1.5 rounded transition">
            Inicio
        </button>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="max-w-5xl mx-auto px-6 py-8 w-full flex-grow space-y-6">

        <!-- TÍTULO DE SECCIÓN -->
        <h2 class="font-bold text-slate-900 text-sm">Buscar Rutas Disponibles</h2>

        <!-- CAJA DE BÚSQUEDA -->
        <div class="admin-card p-6">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 items-end">
                <div>
                    <label class="block text-[11px] font-semibold text-slate-500 mb-1">Origen</label>
                    <input type="text" id="filtroOrigen" oninput="filtrarRutasPasajero()" placeholder="Ciudad de salida"
                        class="w-full border border-slate-300 rounded px-3 py-2 text-xs focus:outline-none focus:border-blue-500 bg-white">
                </div>
                <div>
                    <label class="block text-[11px] font-semibold text-slate-500 mb-1">Destino</label>
                    <input type="text" id="filtroDestino" oninput="filtrarRutasPasajero()"
                        placeholder="Ciudad de llegada"
                        class="w-full border border-slate-300 rounded px-3 py-2 text-xs focus:outline-none focus:border-blue-500 bg-white">
                </div>
                <div>
                    <button onclick="filtrarRutasPasajero()"
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold py-2.5 rounded transition">
                        Buscar
                    </button>
                </div>
            </div>
        </div>

        <!-- CONTENEDOR DINÁMICO DE TARJETAS (Aquí se cargan las rutas del administrador) -->
        <div id="contenedorTarjetas" class="space-y-4">
            <!-- Se llena automáticamente con JavaScript -->
        </div>

    </main>

    <script src="pasajero.js"></script>

    <!-- PIE DE PÁGINA (FOOTER) -->
    <footer class="bg-slate-900 text-slate-400 py-8 border-t border-slate-800">
        <div class="max-w-7xl mx-auto px-4 flex flex-col md:flex-row justify-between items-center gap-6">
            <div class="text-center md:text-left">
                <h4 class="text-white font-bold text-base mb-1">Sistema de Reserva de Buses</h4>
                <p class="text-xs text-slate-500">Plataforma integrada para gestión y reserva de transporte.</p>
            </div>
            <div class="text-center md:text-right text-xs">
                <p class="text-slate-300 font-semibold mb-1">Contacto</p>
                <p>+505 8888 8888</p>
                <p>correo@correo.com</p>
            </div>
        </div>
        <div class="max-w-7xl mx-auto px-4 mt-6 pt-6 border-t border-slate-800 text-center text-xs text-slate-600">
            © 2026 Sistema de Reserva de Buses. Todos los derechos reservados.
        </div>
    </footer>
</body>

</html>
